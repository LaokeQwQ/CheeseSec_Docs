# CheeseSec product documentation site.
# Theme: OINK v0.4.1. Production URL is the Cloudflare Pages custom domain.

title: CheeseSec Docs
baseURL: https://docs.cheesesec.com/
defaultContentLanguage: en
enableRobotsTXT: true
# Turn on after the first git commit if you want “last modified” from git.
enableGitInfo: false
enableEmoji: true

ignoreLogs:
  - warning-frontmatter-params-overrides

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 4
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true
  highlight:
    noClasses: false

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: CheeseSec Docs
    params:
      description: Product manuals for CheeseSec. CheeseWAF is documented here.
    menus:
      main:
        - identifier: docs
          name: Docs
          pageRef: /docs
          weight: 10
        - identifier: cheesewaf
          parent: docs
          name: CheeseWAF
          pageRef: /docs/cheesewaf
          weight: 10
          params:
            icon: fa-solid fa-shield-halved
            description: Self-hosted Web Application Firewall
        - identifier: github
          name: GitHub
          url: https://github.com/LaokeQwQ/CheeseWAF
          weight: 90
          params:
            icon: fa-brands fa-github

  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: CheeseSec 文档
    params:
      description: CheeseSec 产品手册。目前收录 CheeseWAF。
      time_format_blog: 2006年1月2日
      time_format_default: 2006年1月2日
    menus:
      main:
        - identifier: docs
          name: 文档
          pageRef: /docs
          weight: 10
        - identifier: cheesewaf
          parent: docs
          name: CheeseWAF
          pageRef: /docs/cheesewaf
          weight: 10
          params:
            icon: fa-solid fa-shield-halved
            description: 自托管的 Web 应用防火墙
        - identifier: github
          name: GitHub
          url: https://github.com/LaokeQwQ/CheeseWAF
          weight: 90
          params:
            icon: fa-brands fa-github

params:
  description: Product documentation for CheeseSec.
  copyright:
    authors: '[LaokeQwQ](https://github.com/LaokeQwQ)'
    from_year: 2026
    to_year: present
  footer_center_info: 'CheeseSec Docs · [CheeseWAF](https://github.com/LaokeQwQ/CheeseWAF)'
  github_repo: https://github.com/LaokeQwQ/CheeseSec_Docs
  github_project_repo: https://github.com/LaokeQwQ/CheeseWAF
  github_branch: main
  github_subdir: ''
  offlineSearch: true
  offlineSearchIndex: summary
  offlineSearchSummaryLength: 70
  offlineSearchMaxResults: 10
  prism_syntax_highlighting: false
  page_width: normal
  comments:
    enable: false
  ui:
    typography:
      preset: technical
    showLightDarkModeMenu: true
    sidebar_menu_compact: true
    sidebar_menu_foldable: true
    sidebar_search_disable: false
    sidebar_root_enabled: true
    sidebar_root_menu: true
    sidebar_item_overflow: ellipsis
    ul_show: 2
    feedback:
      enable: false
    readingtime:
      enable: false
  links:
    user:
      - name: CheeseWAF docs
        url: /docs/cheesewaf/
        icon: fa-solid fa-book-open
        desc: Install, configure, and operate CheeseWAF
      - name: CheeseWAF on GitHub
        url: https://github.com/LaokeQwQ/CheeseWAF
        icon: fa-brands fa-github
        desc: Source, issues, and releases
    developer:
      - name: Site source
        url: https://github.com/LaokeQwQ/CheeseSec_Docs
        icon: fa-brands fa-github
        desc: This documentation repository
      - name: Releases
        url: https://github.com/LaokeQwQ/CheeseWAF/releases
        icon: fa-solid fa-download
        desc: Packaged CheeseWAF builds

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
  mounts:
    - source: content
      target: content
      sites: { matrix: { languages: [en, zh] } }
    - source: static
      target: static
    - source: layouts
      target: layouts
    - source: data
      target: data
    - source: assets
      target: assets
    - source: i18n
      target: i18n
    - source: archetypes
      target: archetypes
